services:
  - type: web
    name: capsule-quest-leaderboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: LEADERBOARD_SECRET
        generateValue: true
      # (선택) 계정이 서버 재시작 때 지워지지 않게 하려면 무료 Postgres 주소를 넣으세요.
      # 비워 두면 SQLite 파일에 저장합니다. 자세한 건 game/서버_로그인_안내.md
      - key: DATABASE_URL
        sync: false
      # (선택) 토스페이먼츠 결제 키. 비워 두면 문서 공개 테스트 키로 "테스트 결제"만 돼요.
      # 진짜 판매 전에는 반드시 DATABASE_URL(Postgres)도 넣으세요 — 구매 기록이 지워지면 안 돼요.
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      # 결제창에 보여 줄 환불·문의 연락처 (예: 이메일)
      - key: SHOP_CONTACT
        sync: false
      # (구글 플레이 앱) PWABuilder가 준 assetlinks.json 의 package_name 과 sha256 지문.
      # 지문이 여러 개면 쉼표로 이어서. 자세한 건 game/구글플레이_출시_안내.md
      - key: TWA_PACKAGE
        sync: false
      - key: TWA_SHA256
        sync: false
